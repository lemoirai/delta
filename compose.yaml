# Local dev/test stack. See AGENTS.md before using.
#
#   docker compose up -d --wait     -> site http://127.0.0.1:4321
#                                      PocketBase admin http://127.0.0.1:8090/_/
#                                      Mailpit (captured email) http://127.0.0.1:8025
#   docker compose logs -f web pocketbase
#   docker compose down -v          (wipes the local database: clean slate)

name: delta

services:
  pocketbase:
    build:
      context: docker/pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-0.40.6} # keep in sync with backend/.pocketbase-version
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-admin@example.test}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-local-only-password}
    volumes:
      - ./backend/pb_hooks:/pb_hooks
      - ./backend/pb_migrations:/pb_migrations
      - pb_data:/pb_data
    ports:
      - '127.0.0.1:8090:8090'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8090/api/health']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.33.1
    environment:
      MP_DISABLE_VERSION_CHECK: '1'
    ports:
      - '127.0.0.1:8025:8025' # web UI and API; SMTP is 1025 inside the network

  web:
    # Node 24 LTS ships npm 11, the same major as the host. npm 10 (node:22/20)
    # rewrites package-lock.json by stripping "libc" fields, even under npm ci.
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx astro dev --force --host 0.0.0.0 --port 4321"
    environment:
      PUBLIC_PB_URL: '' # same origin; Vite proxies /api to PocketBase
      PB_PROXY_TARGET: http://pocketbase:8090
      # Windows bind mounts don't deliver file-change events into the container
      CHOKIDAR_USEPOLLING: '1'
      ASTRO_TELEMETRY_DISABLED: '1'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules # Linux modules stay off the Windows mount
    ports:
      - '127.0.0.1:4321:4321' # localhost only, not the LAN
    depends_on:
      pocketbase:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4321').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      start_period: 180s
      retries: 30

volumes:
  pb_data:
  web_node_modules:
