<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Delta Aesthetics - Booking</title>
  <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"></script>
  <style>
    .slot-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .slot-btn { padding: 8px 12px; border: 1px solid #ccc; background: #fff; cursor: pointer; border-radius: 4px; }
    .slot-btn.selected { background: #007bff; color: white; border-color: #0056b3; }
    .slot-btn:disabled { background: #e0e0e0; color: #888; cursor: not-allowed; border-color: #d0d0d0; }
  </style>
</head>
<body>
  <h1>Book an Appointment</h1>
  
  <form id="booking-form">
    <p>
      <label>Name:<br><input type="text" id="name" required /></label>
    </p>
    <p>
      <label>Email:<br><input type="email" id="email" required /></label>
    </p>
    <p>
      <label>Select Date:<br><input type="date" id="booking-date" required /></label>
    </p>

    <!-- Available Slots Container -->
    <p>
      <label>Available Time Slots:</label>
      <div id="slots-container" class="slot-grid">
        <span style="color: #666; font-size: 0.9em;">Please select a date above to view available times.</span>
      </div>
    </p>

    <!-- Hidden input to hold the chosen ISO string -->
    <input type="hidden" id="selected-slot" required />

    <!-- Short Notice Opt-In -->
    <fieldset style="margin-top: 1em;">
      <legend>Short Notice Options</legend>
      <label>
        <input type="checkbox" id="short-notice-toggle" />
        Notify me if an earlier appointment slot opens up!
      </label>

      <div id="notice-options" style="display: none; margin-top: 0.5em;">
        <label>Minimum notice needed:
          <input type="number" id="notice-value" min="1" value="2" style="width: 60px;" />
          <select id="notice-unit">
            <option value="hours" selected>Hour(s)</option>
            <option value="days">Day(s)</option>
          </select>
        </label>
      </div>
    </fieldset>

    <p><button type="submit" style="margin-top: 15px;">Submit Request</button></p>
  </form>

  <script>
    const pb = new PocketBase('https://api.delta-aesthetics.com');

    // Define standard daily slots (e.g., 10:00 AM, 12:00 PM, 2:00 PM, 4:00 PM)
    const STANDARD_HOURS = [10, 12, 14, 16]; 

    const dateInput = document.getElementById('booking-date');
    const slotsContainer = document.getElementById('slots-container');
    const selectedSlotInput = document.getElementById('selected-slot');

    // When date changes, fetch booked slots and render choices
    dateInput.addEventListener('change', async () => {
      const chosenDate = dateInput.value;
      if (!chosenDate) return;

      slotsContainer.innerHTML = 'Loading available slots...';

      try {
        // Query PocketBase bookings for this specific date
        // (Assumes booking_date is stored in ISO format compatible with filtering)
        const startOfDay = `${chosenDate} 00:00:00`;
        const endOfDay = `${chosenDate} 23:59:59`;

        const existingBookings = await pb.collection('bookings').getFullList({
          filter: `booking_date >= '${startOfDay}' && booking_date <= '${endOfDay}' && status != 'cancelled_by_client' && status != 'cancelled_by_admin'`
        });

        // Extract booked hours
        const bookedHours = existingBookings.map(b => {
          const d = new Date(b.booking_date);
          return d.getHours();
        });

        // Render slots
        slotsContainer.innerHTML = '';
        STANDARD_HOURS.forEach(hour => {
          const btn = document.createElement('button');
          type = 'button';
          btn.type = 'button';
          
          // Format display time (e.g., 10:00 AM)
          const displayHour = hour > 12 ? hour - 12 : hour;
          const ampm = hour >= 12 ? 'PM' : 'AM';
          btn.textContent = `${displayHour}:00 ${ampm}`;
          btn.className = 'slot-btn';

          const isTaken = bookedHours.includes(hour);

          if (isTaken) {
            btn.disabled = true;
            btn.title = 'This slot is already booked';
          } else {
            btn.addEventListener('click', () => {
              // Highlight selection
              document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
              btn.classList.add('selected');

              // Construct ISO datetime string for submission
              const isoString = `${chosenDate}T${String(hour).padStart(2, '0')}:00:00.000Z`;
              selectedSlotInput.value = isoString;
            });
          }

          slotsContainer.appendChild(btn);
        });

      } catch (err) {
        console.error('Error fetching slots:', err);
        slotsContainer.innerHTML = '<span style="color: red;">Could not load slots.</span>';
      }
    });

    // Toggle short notice inputs
    const toggle = document.getElementById('short-notice-toggle');
    const options = document.getElementById('notice-options');
    toggle.addEventListener('change', () => {
      options.style.display = toggle.checked ? 'block' : 'none';
    });

    // Form submit handler
    document.getElementById('booking-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!selectedSlotInput.value) {
        alert('Please select an available time slot.');
        return;
      }

      const acceptsShortNotice = toggle.checked;
      let noticeHours = 0;

      if (acceptsShortNotice) {
        const val = parseInt(document.getElementById('notice-value').value, 10);
        const unit = document.getElementById('notice-unit').value;
        noticeHours = (unit === 'days') ? val * 24 : val;
      }

      const payload = {
        customer_name: document.getElementById('name').value,
        customer_email: document.getElementById('email').value,
        booking_date: selectedSlotInput.value,
        status: 'pending',
        accepts_short_notice: acceptsShortNotice,
        notice_lead_time: noticeHours
      };

      try {
        await pb.collection('bookings').create(payload);
        alert('Booking request received!');
        document.getElementById('booking-form').reset();
        slotsContainer.innerHTML = '<span style="color: #666; font-size: 0.9em;">Please select a date above to view available times.</span>';
        options.style.display = 'none';
      } catch (err) {
        console.error('Submission failed:', err);
        alert('Could not submit booking request.');
      }
    });
  </script>
</body>
</html>
